<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Walls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--k:#19d3ff;--k2:#0b6e8f;--panel:rgba(6,28,42,.55);--text:#bff3ff;--warn:#ffd23f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#04090f;color:var(--text);font:600 18px/1.4 Rajdhani,system-ui,sans-serif;overflow-x:hidden}
#bg,#bgv{position:fixed;inset:0;width:100%;height:100%;z-index:-2;object-fit:cover}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(ellipse at center,transparent 40%,rgba(2,6,12,.75)),repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.14) 3px)}
main{max-width:1180px;margin:0 auto;padding:40px 24px 100px}
/* corner-bracket frame */
.brk{position:relative}
.brk::before{content:"";position:absolute;inset:-7px;pointer-events:none;background-repeat:no-repeat;filter:drop-shadow(0 0 6px var(--k));
 background-image:linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),
  linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k));
 background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;
 background-size:38px 3px,3px 38px,38px 3px,3px 38px,38px 3px,3px 38px,38px 3px,3px 38px}
/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;margin-bottom:44px;padding:20px 28px;
 background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(25,211,255,.35)}
.hdr h1{margin:0;font:800 clamp(1.8rem,5vw,3.2rem)/1 Orbitron,sans-serif;letter-spacing:.1em;color:#d9fbff;
 text-shadow:0 0 10px var(--k),0 0 30px var(--k);animation:flicker 7s infinite}
.tag{font:500 .72rem/1.5 Orbitron,sans-serif;letter-spacing:.12em;color:var(--k);opacity:.8;position:relative}
.tag.l{text-align:left;padding-bottom:12px;border-bottom:1px solid var(--k2);background:linear-gradient(90deg,var(--k) 0 22%,transparent 22%) bottom/100% 2px no-repeat}
.tag.r{text-align:right;padding-bottom:12px;border-bottom:1px solid var(--k2);background:linear-gradient(270deg,var(--k) 0 22%,transparent 22%) bottom/100% 2px no-repeat}
.tag i{font-style:normal;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.75}95%{opacity:1}96%{opacity:.6}}
/* category */
.cat{margin-bottom:26px}
.head{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 22px;cursor:pointer;
 font:500 1.15rem Orbitron,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#d9fbff;
 background:linear-gradient(90deg,rgba(25,211,255,.28),rgba(10,60,85,.5) 60%);backdrop-filter:blur(10px);
 border:1px solid rgba(25,211,255,.4);border-left:6px solid var(--k);transition:box-shadow .3s,transform .3s}
.head:hover{box-shadow:0 0 28px -4px var(--k);transform:translateX(5px)}
.head em{font-style:normal;opacity:.7;margin-left:6px}
.head b{color:var(--k);transition:transform .4s}
.open .head b{transform:rotate(180deg)}
.wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1)}
.open .wrap{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0;padding:0 8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 0 28px}
.search{width:min(360px,90%);padding:9px 14px;font:600 1rem Rajdhani,sans-serif;color:var(--text);background:rgba(6,28,42,.6);
 border:1px solid var(--k2);outline:0;transition:border-color .3s,box-shadow .3s}
.search:focus{border-color:var(--k);box-shadow:0 0 16px -2px var(--k)}
.seg{display:flex;position:relative;padding:4px;background:rgba(6,28,42,.6);backdrop-filter:blur(10px);border:1px solid var(--k2)}
.seg button,.pages button{font:500 .95rem Orbitron,sans-serif;letter-spacing:.08em;color:var(--text);background:none;border:0;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.seg button{padding:9px 28px}.seg button.on{color:#03121a}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--k);box-shadow:0 0 16px var(--k);transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.seg.light .pill{transform:translateX(100%)}
.pages{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pages button{padding:7px 14px;background:rgba(6,28,42,.6);border:1px solid var(--k2);transition:all .25s}
.pages button:hover{border-color:var(--k);transform:translateY(-3px);box-shadow:0 0 12px -2px var(--k)}
.pages button.on{background:var(--k);color:#03121a;box-shadow:0 0 16px var(--k)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:28px;margin:6px 6px 18px;
 background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(25,211,255,.3)}
.grid a{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;border:2px solid var(--k);box-shadow:0 0 12px -3px var(--k);
 animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*55ms);transition:transform .3s,box-shadow .3s}
.grid a::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(160,240,255,.45) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.grid a:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 12px 30px -4px var(--k);z-index:2}
.grid a:hover::after{transform:translateX(120%)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font:500 .62rem Orbitron,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 background:rgba(3,18,26,.8);color:var(--k);transform:translateY(100%);transition:transform .3s;z-index:1}
.grid a:hover span{transform:none}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.92);filter:blur(6px)}}
.empty{grid-column:1/-1;text-align:center;padding:34px;color:var(--k);font:500 1rem Orbitron,sans-serif;letter-spacing:.2em;animation:blink 2s infinite}
/* lightbox */
#lb{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(2,8,14,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#lb.on{display:grid;animation:fade .3s}
#lb div{display:flex;flex-direction:column;align-items:center}
#lb img{max-width:92vw;max-height:78vh;border:2px solid var(--k);box-shadow:0 0 50px -6px var(--k);animation:pop .4s both}
#lb a{margin-top:16px;padding:10px 24px;background:var(--k);color:#03121a;text-decoration:none;font:800 .9rem Orbitron,sans-serif;letter-spacing:.12em;box-shadow:0 0 20px var(--k)}
@keyframes fade{from{opacity:0}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.hdr{grid-template-columns:1fr}.tag{display:none}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);padding:14px;gap:10px}main{padding:28px 14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <header class="hdr brk">
    <div class="tag l">SYS//WALLPAPER.DATA<br>STATUS: ONLINE <i>▮</i></div>
    <h1>NEON WALLS</h1>
    <div class="tag r">BUFFERING WALLPAPER GRID<br>▮▮▮▮▮▯▯</div>
  </header>
  <div id="cats"></div>
</main>
<div id="lb"><div><img alt=""><a download target="_blank" rel="noopener">DOWNLOAD</a></div></div>
<script src="wallpapers.js"></script>
<script>
/* ---------- settings ---------- */
const PER_PAGE = 10;        // 5 columns x 2 rows. More images = more page numbers
const BG_VIDEO = "";        // optional: "background.mp4" to use your own looping video instead of the animated city

/* ---------- live background: animated cyberpunk city ---------- */
(function () {
  const cv = document.getElementById("bg");
  if (BG_VIDEO) {
    const v = document.createElement("video");
    Object.assign(v, {id: "bgv", src: BG_VIDEO, autoplay: true, muted: true, loop: true, playsInline: true});
    document.body.prepend(v); cv.remove(); return;
  }
  const g = cv.getContext("2d"), rnd = (a, b) => a + Math.random() * (b - a);
  let W, H, hz, layers, drops, cars = [], t = 0;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function build() {
    W = cv.width = innerWidth; H = cv.height = innerHeight; hz = H * .72;
    const defs = [{sp:.06,col:"#0a1a26",h:[.22,.5],w:[40,90]},{sp:.14,col:"#08141e",h:[.16,.38],w:[50,110]},{sp:.3,col:"#050e16",h:[.1,.28],w:[60,130]}];
    layers = defs.map(d => {
      const b = []; let x = 0;
      while (x < W + 300) {
        const w = rnd(...d.w), h = H * rnd(...d.h), wins = [];
        for (let wx = 8; wx < w - 10; wx += 13) for (let wy = 12; wy < h - 12; wy += 18)
          if (Math.random() < .32) wins.push({x: wx, y: wy, on: Math.random() < .5, c: Math.random() < .75 ? "#19d3ff" : "#ffd23f"});
        b.push({x, w, h, wins}); x += w + rnd(0, 14);
      }
      return {...d, b, span: x, off: 0};
    });
    drops = Array.from({length: Math.min(160, W / 8 | 0)}, () => ({x: rnd(0, W), y: rnd(0, H), l: rnd(10, 24), s: rnd(10, 18)}));
  }

  function frame() {
    t++;
    const sky = g.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, "#02060c"); sky.addColorStop(1, "#0b3a4f");
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const glow = g.createRadialGradient(W / 2, hz, 0, W / 2, hz, W * .5);
    glow.addColorStop(0, "rgba(25,211,255,.28)"); glow.addColorStop(1, "transparent");
    g.fillStyle = glow; g.fillRect(0, 0, W, H);

    layers.forEach(L => {
      L.off = (L.off + L.sp) % L.span;
      for (let i = 0; i < 2; i++) { const k = L.b[(Math.random() * L.b.length) | 0]; if (k.wins.length) { const w = k.wins[(Math.random() * k.wins.length) | 0]; w.on = !w.on; } }
      L.b.forEach(b => {
        let px = b.x - L.off; if (px < -b.w) px += L.span;
        if (px > W) return;
        g.fillStyle = L.col; g.fillRect(px, hz - b.h, b.w, b.h);
        b.wins.forEach(w => { if (w.on) { g.fillStyle = w.c; g.globalAlpha = .75; g.fillRect(px + w.x, hz - b.h + w.y, 4, 6); } });
        g.globalAlpha = 1;
      });
    });

    g.fillStyle = "#03090f"; g.fillRect(0, hz, W, H - hz);       // ground
    g.strokeStyle = "rgba(25,211,255,.3)"; g.lineWidth = 1; g.beginPath();
    for (let i = -20; i <= 20; i++) { g.moveTo(W / 2 + i * 12, hz); g.lineTo(W / 2 + i * W / 10, H); }
    for (let i = 0; i < 12; i++) { const p = ((i + (t * .02) % 1) / 12) ** 2.2, y = hz + p * (H - hz); g.moveTo(0, y); g.lineTo(W, y); }
    g.stroke();

    if (Math.random() < .012 && cars.length < 5) {            // flying car streaks
      const dir = Math.random() < .5 ? 1 : -1;
      cars.push({x: dir > 0 ? -80 : W + 80, y: rnd(H * .1, hz * .8), v: dir * rnd(4, 9), c: Math.random() < .5 ? "#ff2bd6" : "#19d3ff"});
    }
    cars = cars.filter(c => c.x > -120 && c.x < W + 120);
    cars.forEach(c => {
      c.x += c.v; const tr = g.createLinearGradient(c.x, 0, c.x - c.v * 12, 0);
      tr.addColorStop(0, c.c); tr.addColorStop(1, "transparent");
      g.strokeStyle = tr; g.lineWidth = 3; g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(c.x - c.v * 12, c.y); g.stroke();
    });

    g.strokeStyle = "rgba(150,225,255,.28)"; g.lineWidth = 1; g.beginPath();  // rain
    drops.forEach(d => { g.moveTo(d.x, d.y); g.lineTo(d.x - 2, d.y + d.l); d.y += d.s; d.x -= .8; if (d.y > H) { d.y = -20; d.x = rnd(0, W + 40); } });
    g.stroke();
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { build(); if (still) frame(); });
  build(); frame();
})();

/* ---------- gallery ---------- */
const COLORS = {};  // all categories share the HUD cyan; kept for future per-category colors
const thumb = f => f.replace(/^wallpapers\//, "thumbs/").replace(/\.[^.]+$/, ".webp");
const root = document.getElementById("cats");
const lb = document.getElementById("lb"), lbImg = lb.querySelector("img"), lbA = lb.querySelector("a");
lb.onclick = e => { if (e.target !== lbA) lb.classList.remove("on"); };
addEventListener("keydown", e => e.key === "Escape" && lb.classList.remove("on"));

Object.entries(WALLS).forEach(([name, sets], idx) => {
  const count = (sets.dark?.length || 0) + (sets.light?.length || 0);
  const state = {variant: sets.dark?.length || !sets.light?.length ? "dark" : "light", page: 1, q: ""};
  const cat = document.createElement("section");
  cat.className = "cat";
  if (COLORS[name]) cat.style.setProperty("--k", COLORS[name]);
  cat.innerHTML = `<div class="head" role="button" tabindex="0"><span>${name}<em>(${count})</em></span><b>▼</b></div>
    <div class="wrap"><div class="inner"><div class="bar">
      <input class="search" type="search" placeholder="Search ${name}…" aria-label="Search ${name}">
      <div class="seg"><span class="pill"></span><button data-v="dark">Dark</button><button data-v="light">Light</button></div>
      <div class="pages"></div></div><div class="grid brk"></div></div></div>`;
  const $ = s => cat.querySelector(s), seg = $(".seg"), pages = $(".pages"), grid = $(".grid");

  function render() {
    const files = (sets[state.variant] || []).filter(f => f.toLowerCase().includes(state.q));
    const total = Math.max(1, Math.ceil(files.length / PER_PAGE));
    seg.classList.toggle("light", state.variant === "light");
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === state.variant));
    pages.innerHTML = Array.from({length: total}, (_, i) => `<button data-p="${i+1}" class="${i+1===state.page?"on":""}">${i+1}</button>`).join("");
    const slice = files.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
    grid.innerHTML = slice.length
      ? slice.map((f, i) => `<a href="${f}" style="--i:${i}"><img loading="lazy" src="${thumb(f)}" onerror="this.onerror=null;this.src='${f}'" alt=""><span>${f.split("/").pop()}</span></a>`).join("")
      : `<div class="empty">${count ? "NO MATCHES" : "COMING SOON"}</div>`;
  }
  seg.onclick = e => { const v = e.target.dataset.v; if (v) { state.variant = v; state.page = 1; render(); } };
  pages.onclick = e => { const p = e.target.dataset.p; if (p) { state.page = +p; render(); } };
  $(".search").oninput = e => { state.q = e.target.value.trim().toLowerCase(); state.page = 1; render(); };
  grid.onclick = e => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); lbImg.src = lbA.href = a.getAttribute("href"); lb.classList.add("on"); };
  const toggle = () => cat.classList.toggle("open");
  $(".head").onclick = toggle;
  $(".head").onkeydown = e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), toggle());
  root.appendChild(cat);
  render();
});
const firstFilled = [...root.children].find(c => !c.querySelector(".empty")) || root.firstElementChild;
firstFilled?.classList.add("open");
</script>
</body>
</html>
